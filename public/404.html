<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Collegiate 100 · University of Houston (Clutch City)</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a deep link like
      // /UH-C100/events/foo 404s. This redirects it to the app root with
      // the original path encoded in the query string; index.html decodes
      // it back before React Router mounts.
      var pathSegmentsToKeep = 1; // keep "/UH-C100"

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
